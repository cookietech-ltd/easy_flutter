name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Package - analyze and test
        working-directory: packages/easy_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: App - analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
